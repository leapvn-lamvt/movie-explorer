<section class="recently-released mb-5" *ngIf="movies.length > 0 || loading || error">
  <h2 class="mb-4 fw-bold" style="letter-spacing:1px;">Phim mới phát hành</h2>
  <div *ngIf="loading" class="text-center mb-3">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
    <p class="mt-2">Loading recently released movies...</p>
  </div>
  <div *ngIf="error && !loading" class="alert alert-warning text-center mb-3" role="alert">
    {{ error }}
  </div>
  <div class="row justify-content-center">
    <div class="col-md-4 mb-4" *ngFor="let movie of movies">
      <app-movie-card [movie]="movie"></app-movie-card>
    </div>
  </div>
</section>

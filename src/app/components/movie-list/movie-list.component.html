<div *ngIf="movies && movies.length > 0">
  <div class="row">
    <div class="col-md-4 mb-4" *ngFor="let movie of movies">
      <app-movie-card [movie]="movie"></app-movie-card>
    </div>
  </div>
</div>
<div *ngIf="movies && movies.length === 0">
  <p class="text-center">No movies found.</p>
</div>

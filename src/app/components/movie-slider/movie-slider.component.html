<div *ngIf="loading">Loading...</div>
<div *ngIf="error" class="error">{{ error }}</div>

<ngx-slick-carousel class="carousel" [config]="slideConfig" *ngIf="!loading && featuredMovies.length" >
  <div ngxSlickItem *ngFor="let movie of featuredMovies" class="slide">
    <img class="slide-img" [src]="movie.Poster" [alt]="movie.Title" />
  </div>
</ngx-slick-carousel>

<div class="movie-card">
  <div class="movie-card-img">
    <img class="poster-img" [src]="movie.Poster" [alt]="movie.Title" />

    <div
      class="overlay d-flex flex-column justify-content-center align-items-center text-white bg-dark bg-opacity-75 position-absolute top-0 start-0 w-100 h-100 opacity-0 hover-opacity-100 transition"
    >
      <div class="mb-2">Xem chi tiết</div>
      <div class="d-flex gap-3">
        <i class="fa fa-play" title="Play"></i>
        <i class="fa fa-info-circle" title="More Info"></i>
        <i class="fa fa-heart" title="Add to Favorites"></i>
      </div>
    </div>
  </div>

  <div class="info">
    <h4 class="movie-title">{{ movie.Title }}</h4>
    <span class="movie-year">{{ movie.Year }}</span>
  </div>
</div>

<form class="row justify-content-center mb-5" (submit)="onSubmit($event)">
  <div class="col-md-6 col-sm-8 mb-2">
    <input type="text" class="form-control" placeholder="Search for a movie..." [(ngModel)]="searchQuery" name="searchQuery">
  </div>
  <div class="col-auto mb-2">
    <button type="submit" class="btn btn-primary w-100">Search</button>
  </div>
</form>
